<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groovy - Spotify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <img src="icons/icon48.png" alt="Groovy" class="logo">
      <h1>Groovy</h1>
    </header>

    <!-- Login Section (shown when not logged in) -->
    <section id="login-section" class="section hidden">
      <p class="description">Login with Spotify to start skipping to the groovy parts of your songs.</p>
      <button id="login-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" class="spotify-icon">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Login with Spotify
      </button>
    </section>

    <!-- Main Section (shown when logged in) -->
    <section id="main-section" class="section hidden">
      <!-- Toggle -->
      <div class="toggle-row">
        <span>Enable Groovy</span>
        <label class="toggle">
          <input type="checkbox" id="enable-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Current Track Info -->
      <div id="track-info" class="track-info">
        <div class="track-loading">
          <div class="spinner"></div>
          <span>Loading track info...</span>
        </div>
      </div>

      <!-- Groovy Part Editor -->
      <div id="groovy-editor" class="groovy-editor hidden">
        <h3>Set Groovy Part</h3>

        <div class="time-inputs">
          <div class="time-input-group">
            <label for="intime-input">Start Time</label>
            <div class="time-input-wrapper">
              <input type="text" id="intime-input" placeholder="0:00" class="time-input">
              <button id="set-intime-btn" class="btn btn-small" title="Set to current time">Now</button>
            </div>
          </div>

          <div class="time-input-group">
            <label for="outtime-input">End Time</label>
            <div class="time-input-wrapper">
              <input type="text" id="outtime-input" placeholder="0:00" class="time-input">
              <button id="set-outtime-btn" class="btn btn-small" title="Set to current time">Now</button>
            </div>
          </div>
        </div>

        <button id="save-groovy-btn" class="btn btn-primary btn-full">
          Save Groovy Part
        </button>

        <p id="groovy-status" class="status-message hidden"></p>
      </div>

      <!-- Existing Groovy Data Display -->
      <div id="existing-groovy" class="existing-groovy hidden">
        <h3>Current Groovy Part</h3>
        <div class="groovy-times">
          <span>Start: <strong id="existing-intime">-</strong></span>
          <span>End: <strong id="existing-outtime">-</strong></span>
        </div>
        <p class="contribution-info">
          <span id="contribution-count">0</span> contribution(s)
        </p>
      </div>

      <!-- Logout -->
      <div class="logout-row">
        <button id="logout-btn" class="btn btn-text">Logout</button>
      </div>
    </section>

    <!-- Status Bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
